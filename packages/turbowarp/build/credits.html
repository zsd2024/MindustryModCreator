<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TurboWarp Credits</title>
    <style>
      body[data-splash-theme="dark"] {
        background: #111;
      }

      noscript {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
    </style>
  <script defer src="js/vendors-node_modules_pnpm_css-loader_7_1_4_webpack_5_108_4_node_modules_css-loader_dist_runti-219cd6.js"></script><script defer src="js/vendors-node_modules_lodash_defaultsdeep_index_js.js"></script><script defer src="js/credits.js"></script></head>
  <body>
    <noscript>
      <h1>This page requires JavaScript</h1>
    </noscript>

    <script>
      (function() {
        var theme = '';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            if (parsed.gui === 'dark' || parsed.gui === 'light') {
              theme = parsed.gui;
            }
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        document.body.setAttribute('data-splash-theme', theme);
      })();
    </script>

    <div id="app"></div>
  </body>
</html>
